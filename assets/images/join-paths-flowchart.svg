<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ways to join the S²E Lab</title>
  <desc id="desc">A flowchart summarizing the application paths for Ph.D. students, current Notre Dame master's students, and undergraduate students.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172331" flood-opacity="0.12"/>
    </filter>
    <style>
      @font-face { font-family: "Oswald"; src: url("../fonts/oswald-700.ttf"); font-weight: 700; }
      @font-face { font-family: "Space Grotesk"; src: url("../fonts/space-grotesk-400.ttf"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("../fonts/space-grotesk-600.ttf"); font-weight: 600; }
      @font-face { font-family: "Space Grotesk"; src: url("../fonts/space-grotesk-700.ttf"); font-weight: 700; }
      @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/ibm-plex-mono-600.ttf"); font-weight: 600; }
      .sans { font-family: "Space Grotesk", sans-serif; }
      .mono { font-family: "IBM Plex Mono SemiBold", "IBM Plex Mono", monospace; }
      .title { font-family: "Oswald", sans-serif; font-size: 58px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { font-size: 22px; }
      .question { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .path-title { font-family: "Oswald", sans-serif; font-size: 31px; font-weight: 700; text-transform: uppercase; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
      .step { font-family: "Oswald", sans-serif; font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .foot { font-size: 17px; }
      .subject { font-size: 11px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <path d="M0 0H1600V250H0Z" fill="#233142"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 45H1600M0 90H1600M0 135H1600M0 180H1600M0 225H1600"/>
    <path d="M50 0V250M100 0V250M150 0V250M200 0V250M250 0V250M300 0V250M350 0V250M400 0V250M450 0V250M500 0V250M550 0V250M600 0V250M650 0V250M700 0V250M750 0V250M800 0V250M850 0V250M900 0V250M950 0V250M1000 0V250M1050 0V250M1100 0V250M1150 0V250M1200 0V250M1250 0V250M1300 0V250M1350 0V250M1400 0V250M1450 0V250M1500 0V250M1550 0V250"/>
  </g>

  <text x="800" y="88" text-anchor="middle" class="mono label" fill="#ffffff">S²E LAB // FIND YOUR PATH</text>
  <text x="800" y="157" text-anchor="middle" class="sans title" fill="#ffffff">WAYS TO JOIN THE S²E LAB</text>
  <text x="800" y="205" text-anchor="middle" class="sans subtitle" fill="#eef2f3">Choose the path that matches where you are in your studies.</text>
  <a href="https://s2elab.org" target="_blank">
    <g fill="none" stroke="#ffffff" stroke-width="1.7">
      <circle cx="665" cy="231" r="9"/>
      <path d="M656 231H674M665 222C661 226 661 236 665 240M665 222C669 226 669 236 665 240"/>
    </g>
    <text x="682" y="236" class="mono" font-size="13" font-weight="600" fill="#ffffff">s2elab.org</text>
  </a>
  <text x="800" y="236" text-anchor="middle" class="mono" font-size="13" fill="#aebbc1">•</text>
  <a href="https://www.instagram.com/s2elab/" target="_blank">
    <g fill="none" stroke="#ffffff" stroke-width="1.7">
      <rect x="833" y="222" width="18" height="18" rx="5"/>
      <circle cx="842" cy="231" r="4"/>
      <circle cx="847" cy="226" r="1" fill="#ffffff" stroke="none"/>
    </g>
    <text x="860" y="236" class="mono" font-size="13" font-weight="600" fill="#ffffff">@s2elab</text>
  </a>

  <rect x="530" y="275" width="540" height="70" rx="4" fill="#233142"/>
  <rect x="540" y="285" width="540" height="70" rx="4" fill="#d54c4c"/>
  <rect x="530" y="275" width="540" height="70" rx="4" fill="#233142"/>
  <text x="800" y="319" text-anchor="middle" class="mono question" fill="#ffffff">WHICH STUDENT PATH DESCRIBES YOU?</text>

  <g fill="none" stroke="#aebbc1" stroke-width="4">
    <path d="M800 345V390H285V430"/>
    <path d="M800 345V430"/>
    <path d="M800 390H1315V430"/>
  </g>
  <g fill="#d54c4c">
    <rect x="279" y="424" width="12" height="12" transform="rotate(45 285 430)"/>
    <rect x="794" y="424" width="12" height="12" transform="rotate(45 800 430)"/>
    <rect x="1309" y="424" width="12" height="12" transform="rotate(45 1315 430)"/>
  </g>

  <!-- Undergraduate path -->
  <g filter="url(#shadow)">
    <rect x="70" y="430" width="480" height="550" rx="8" fill="#ffffff"/>
    <rect x="70" y="430" width="480" height="10" rx="5" fill="#407088"/>
  </g>
  <text x="155" y="498" class="sans path-title" fill="#172331">Undergrad Students</text>
  <rect x="105" y="540" width="360" height="132" rx="4" fill="#edf1f2"/>
  <text x="130" y="575" class="mono label" fill="#d54c4c">ELIGIBILITY</text>
  <text x="130" y="613" class="sans step" fill="#172331">Current ND undergraduate?</text>
  <a href="https://strand.nd.edu">
    <text x="130" y="650" class="sans body" fill="#495968">Required: apply through STRAND.</text>
  </a>
  <path d="M105 742H465" stroke="#d5d0c7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="100" y="780" class="mono label" fill="#d54c4c">OPTIONAL</text>
  <text x="100" y="817" class="sans step" fill="#172331">Email Prof. Santos</text>
  <text x="100" y="850" class="sans body" fill="#495968"><tspan font-weight="bold">📎 Attach:</tspan></text>
  <text x="100" y="880" class="sans body" fill="#495968">CV + transcripts.</text>
  <text x="100" y="910" class="sans body" fill="#495968"><tspan font-weight="bold">✉️ Subject:</tspan></text>
  <text x="100" y="940" class="sans body" fill="#495968">[Prospective Undergrad Student] <tspan font-style="italic">Semester</tspan> <tspan font-style="italic">Year</tspan></text>
  

  <!-- Master's path -->
  <g filter="url(#shadow)">
    <rect x="585" y="430" width="480" height="550" rx="8" fill="#ffffff"/>
    <rect x="585" y="430" width="480" height="10" rx="5" fill="#407088"/>
  </g>
  <text x="670" y="498" class="sans path-title" fill="#172331">Master’s students</text>
  <rect x="620" y="540" width="360" height="132" rx="4" fill="#edf1f2"/>
  <text x="645" y="575" class="mono label" fill="#d54c4c">ELIGIBILITY</text>
  <text x="645" y="613" class="sans step" fill="#172331">Already at Notre Dame?</text>
  <text x="645" y="646" class="sans body" fill="#495968">For current ND master’s students only.</text>
  <path d="M800 672V734" stroke="#407088" stroke-width="4"/>
  <path d="M790 726L800 738L810 726" fill="none" stroke="#407088" stroke-width="4"/>
  <text x="620" y="780" class="mono label" fill="#d54c4c">NEXT STEP</text>
  <text x="620" y="817" class="sans step" fill="#172331">Email Prof. Santos</text>
  <text x="620" y="850" class="sans body" fill="#495968"><tspan font-weight="bold">📎 Attach:</tspan></text>
  <text x="620" y="880" class="sans body" fill="#495968">CV + transcripts.</text>
  <text x="620" y="910" class="sans body" fill="#495968"><tspan font-weight="bold">✉️ Subject:</tspan></text>
  <text x="620" y="940" class="sans body" fill="#495968">[Prospective MS Student] <tspan font-style="italic">Semester</tspan> <tspan font-style="italic">Year</tspan></text>


  

  <!-- Ph.D. path -->
  <g filter="url(#shadow)">
    <rect x="1100" y="430" width="480" height="550" rx="8" fill="#ffffff"/>
    <rect x="1100" y="430" width="480" height="10" rx="5" fill="#407088"/>
  </g>
  <text x="1150" y="498" class="sans path-title" fill="#172331">Prospective Ph.D. students</text>
  <text x="1135" y="565" class="mono label" fill="#d54c4c">REQUIRED</text>
  <text x="1135" y="604" class="sans step" fill="#172331">Apply to the Ph.D. program</text>
  <text x="1135" y="639" class="sans body" fill="#495968">
    <tspan x="1135" dy="0">Use Notre Dame’s formal admissions process and</tspan>
    <tspan x="1135" dy="27">  list Prof. Santos as a faculty member of interest.</tspan>
  </text>
  <path d="M1135 742H1495" stroke="#d5d0c7" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1135" y="780" class="mono label" fill="#d54c4c">OPTIONAL</text>
  <text x="1135" y="817" class="sans step" fill="#172331">Email Prof. Santos</text>
  <text x="1135" y="850" class="sans body" fill="#495968"><tspan font-weight="bold">📎 Attach:</tspan></text>
  <text x="1135" y="880" class="sans body" fill="#495968">CV + transcripts + 1-pg statement + test scores.</text>
  <text x="1135" y="910" class="sans body" fill="#495968"><tspan font-weight="bold">✉️ Subject:</tspan></text>
  <text x="1135" y="940" class="sans body" fill="#495968">[Prospective PhD Student] <tspan font-style="italic">Semester</tspan> <tspan font-style="italic">Year</tspan></text>

  

  
</svg>
